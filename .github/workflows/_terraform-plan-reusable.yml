name: _terraform-plan-reusable

# Runs `terraform plan`, saves the binary plan as a build artifact,
# and posts the human-readable plan on the PR. Nothing here ever
# applies anything - this is the review step. The artifact it
# produces is what _terraform-apply-reusable.yml later applies
# unchanged, so what gets approved is exactly what gets run.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      pr_number:
        required: true
        type: string

permissions:
  id-token: write # OIDC -> AWS
  contents: read
  pull-requests: write # to comment the plan on the PR

env:
  TF_VERSION: "1.9.8"
  AWS_REGION: "ap-southeast-2"

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: accounts/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug role ARN
        run: |
          if [ -z "$ROLE_ARN" ]; then echo "SECRET IS EMPTY"; else echo "SECRET IS SET"; fi
        env:
          ROLE_ARN: ${{ secrets.AWS_TERRAFORM_CI_ROLE_ARN }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check
        run: terraform fmt -check -recursive ../..

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt
          # Pinned alongside the plan so the apply workflow checks out
          # the *exact* code the plan was computed against, even if
          # the PR branch gets new commits before anyone applies it.
          git rev-parse HEAD > commit_sha.txt
          echo '## Terraform plan - ${{ inputs.environment }} (PR #${{ inputs.pr_number }})' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Keyed by PR number (not commit SHA) so re-pushing to the same
      # PR overwrites the artifact with the latest plan, and the
      # apply workflow only ever needs to know the PR number. The
      # pinned commit_sha.txt inside is what actually guards against
      # staleness (see apply workflow).
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-pr${{ inputs.pr_number }}
          path: |
            accounts/${{ inputs.environment }}/tfplan
            accounts/${{ inputs.environment }}/commit_sha.txt
          retention-days: 14

      - name: Comment plan on PR
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          ENVIRONMENT: ${{ inputs.environment }}
        with:
          script: |
            const fs = require('fs');
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const environment = process.env.ENVIRONMENT;
            const plan = fs.readFileSync(`accounts/${environment}/plan.txt`, 'utf8').slice(-60000);
            github.rest.issues.createComment({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan - ${environment}\nSaved as build artifact \`tfplan-${environment}-pr${prNumber}\`. Review it, then run the "Terraform - ${environment} (apply)" workflow with this PR number to apply **exactly this plan**.\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`
            });
